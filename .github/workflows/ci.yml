name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  # ============================================================================
  # Job 1: Linting and Static Type Checking
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

  # ============================================================================
  # Job 2: Unit Testing with LCOV Coverage
  # ============================================================================
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests with Coverage
        run: npm run test:cov
        env:
          NODE_ENV: test

      - name: Upload Coverage Artifact for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================================
  # Job 3: E2E Integration Testing with Isolated PostgreSQL Service
  # ============================================================================
  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prescription_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/prescription_test?schema=public"
      JWT_SECRET: "ci_e2e_jwt_secret_token_key_2026_isolated"
      JWT_EXPIRATION: "7d"
      PORT: 3000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Migrations on Test Database
        run: npx prisma migrate deploy

      - name: Execute E2E Tests
        run: npm run test:e2e

  # ============================================================================
  # Job 4: SonarQube / SonarCloud Analysis with Quality Gate
  # ============================================================================
  sonarqube-analysis:
    name: SonarQube Quality Gate Analysis
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout Repository (Full History for Blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Validate & Configure Sonar Environment
        id: sonar-env
        run: |
          # 1. Resolve and validate SONAR_HOST_URL (secret or repository variable)
          HOST_INPUT="${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}"
          if [ -n "$HOST_INPUT" ]; then
            CLEAN_HOST="$(echo "$HOST_INPUT" | xargs)"
            if [[ ! "$CLEAN_HOST" =~ ^https?:// ]]; then
              echo "::error::SONAR_HOST_URL is invalid ('$CLEAN_HOST'). It must start with http:// or https://"
              exit 1
            fi
            echo "SONAR_HOST_URL=$CLEAN_HOST" >> "$GITHUB_ENV"
            echo "SonarQube Host URL configured: $CLEAN_HOST"
          else
            echo "No SONAR_HOST_URL specified; default SonarQube Cloud endpoint (https://sonarcloud.io) will be used."
          fi

          # 2. Resolve optional SonarCloud organization (secret or repository variable)
          ORG_INPUT="${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION }}"
          if [ -n "$ORG_INPUT" ]; then
            CLEAN_ORG="$(echo "$ORG_INPUT" | xargs)"
            echo "SONAR_ORG_FLAG=-Dsonar.organization=$CLEAN_ORG" >> "$GITHUB_ENV"
            echo "SonarCloud Organization configured: $CLEAN_ORG"
          fi

      - name: Execute SonarQube / SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties
            ${{ env.SONAR_ORG_FLAG }}

      - name: Enforce SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # Job 5: Production Build & Container Verification
  # ============================================================================
  build:
    name: Production Build & Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, e2e-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile NestJS Production Bundle
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Multi-Stage Dockerfile Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: prescription-saas-api:ci-test
