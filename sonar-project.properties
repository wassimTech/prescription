# ==============================================================================
# SONARQUBE / SONARCLOUD CONFIGURATION - PRESCRIPTION SAAS API
# ==============================================================================

# Project Identification
sonar.projectKey=prescription-saas-api
sonar.projectName=Prescription-to-eCommerce SaaS API
sonar.projectVersion=1.0.0

# Source & Test Code Structure
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# File Encoding
sonar.sourceEncoding=UTF-8

# Exclusions from Static Analysis (Generated & Boilerplate Code)
sonar.exclusions=**/node_modules/**,**/dist/**,prisma/migrations/**,**/*.dto.ts

# Test Coverage Integration (Vitest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code Coverage Exclusions (Files excluded from coverage requirements)
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,test/**,src/main.ts,prisma/**,**/*.module.ts,**/*.interface.ts

# Duplicate Code Detection Exclusions
sonar.cpd.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,test/**
