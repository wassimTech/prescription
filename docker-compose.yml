version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: linkers_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-linkers_prescription_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - linkers_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-linkers_prescription_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkers_network
    profiles:
      - infra
      - app
      - all

  # ============================================================================
  # 2. pgAdmin 4 Web GUI
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: linkers_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@linkers.it}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5055}:80"
    volumes:
      - linkers_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkers_network
    profiles:
      - infra
      - tools
      - all

  # ============================================================================
  # 3. NestJS Application (Development)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: linkers_nest_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-linkers_prescription_dev}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkers_network
    profiles:
      - app
      - all

  # ============================================================================
  # 4. Prisma Studio GUI
  # ============================================================================
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: linkers_prisma_studio
    restart: unless-stopped
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-linkers_prescription_dev}?schema=public"
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkers_network
    profiles:
      - tools
      - all

volumes:
  linkers_postgres_data:
  linkers_pgadmin_data:

networks:
  linkers_network:
    driver: bridge
