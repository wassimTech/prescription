services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    profiles: ['dev']
    image: postgres:16-alpine
    container_name: prescription_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prescription_saas_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prescription_saas_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. pgAdmin 4 Web GUI
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: prescription_pgadmin
    profiles: ['dev']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5055}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
