# ==============================================================================
# GITLAB CI/CD PIPELINE - PRESCRIPTION-TO-ECOMMERCE SAAS BACKEND
# ==============================================================================

image: node:22-alpine

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  POSTGRES_HOST_AUTH_METHOD: "trust"

# ------------------------------------------------------------------------------
# STAGES
# ------------------------------------------------------------------------------
stages:
  - lint
  - test
  - quality
  - build

# ------------------------------------------------------------------------------
# GLOBAL CACHE
# ------------------------------------------------------------------------------
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

# ------------------------------------------------------------------------------
# GLOBAL BEFORE SCRIPT
# ------------------------------------------------------------------------------
before_script:
  - apk add --no-cache openssl

# ==============================================================================
# 1. LINT & TYPECHECK STAGE
# ==============================================================================
lint-and-typecheck:
  stage: lint
  script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate
    - npm run lint
    - npx tsc --noEmit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# 2. TEST STAGE: UNIT TESTS & COVERAGE
# ==============================================================================
unit-tests:
  stage: test
  variables:
    NODE_ENV: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate
    - npm run test:cov
  artifacts:
    name: "coverage-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/clover.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# 2. TEST STAGE: E2E INTEGRATION WITH POSTGRESQL SERVICE
# ==============================================================================
e2e-tests:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: prescription_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    NODE_ENV: test
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/prescription_test?schema=public"
    JWT_SECRET: "gitlab_ci_test_jwt_secret_token_key_2026_isolated"
    JWT_EXPIRATION: "7d"
    PORT: 3000
  script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test:e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# 3. QUALITY STAGE: SONARQUBE SCANNER & QUALITY GATE
# ==============================================================================
sonarqube-check:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  before_script: [] # Override global before_script to avoid alpine apk in scanner container
  dependencies:
    - unit-tests
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - >
      sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dproject.settings=sonar-project.properties
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# 4. BUILD STAGE: PRODUCTION ARTIFACT VERIFICATION
# ==============================================================================
build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate
    - npm run build
  artifacts:
    name: "build-$CI_COMMIT_REF_SLUG"
    expire_in: 1 day
    paths:
      - dist/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
